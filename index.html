<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, #0a1929 0%, #000 80%);
    color: #4fd1ff;
    font-family: 'Consolas', 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(79, 209, 255, 0.2);
    letter-spacing: 4px;
    text-shadow: 0 0 10px #4fd1ff;
    font-size: 22px;
  }

  .core {
    position: absolute;
    top: 50%; left: 50%;
    width: 400px; height: 400px;
    margin: -200px 0 0 -200px;
    border-radius: 50%;
    border: 1px solid rgba(79, 209, 255, 0.15);
    box-shadow: 0 0 80px rgba(79, 209, 255, 0.15) inset;
    animation: spin 20s linear infinite;
    pointer-events: none;
  }
  .core::before {
    content: '';
    position: absolute;
    inset: 40px;
    border-radius: 50%;
    border: 1px dashed rgba(79, 209, 255, 0.2);
    animation: spin 12s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #log {
    flex: 1;
    padding: 20px 30px;
    overflow-y: auto;
    z-index: 2;
    font-size: 15px;
    line-height: 1.6;
  }
  .msg { margin-bottom: 10px; animation: fade 0.3s ease; }
  .msg.user { color: #a9b7c6; }
  .msg.jarvis { color: #4fd1ff; text-shadow: 0 0 6px rgba(79,209,255,0.5); }
  .msg.sys { color: #6b7d8f; font-style: italic; font-size: 13px; }
  .msg .prefix { opacity: 0.6; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  footer {
    padding: 15px 20px 25px;
    display: flex;
    gap: 10px;
    justify-content: center;
    z-index: 2;
    border-top: 1px solid rgba(79, 209, 255, 0.15);
  }

  #input {
    width: 60%;
    max-width: 700px;
    padding: 14px 18px;
    background: rgba(79, 209, 255, 0.05);
    border: 1px solid rgba(79, 209, 255, 0.4);
    border-radius: 30px;
    color: #4fd1ff;
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
  }
  #input:focus {
    border-color: #4fd1ff;
    box-shadow: 0 0 20px rgba(79, 209, 255, 0.3);
    background: rgba(79, 209, 255, 0.08);
  }
  #input::placeholder { color: rgba(79, 209, 255, 0.35); }

  button {
    padding: 14px 24px;
    border-radius: 30px;
    background: transparent;
    color: #4fd1ff;
    border: 1px solid rgba(79, 209, 255, 0.4);
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    letter-spacing: 1px;
  }
  button:hover {
    background: rgba(79, 209, 255, 0.1);
    box-shadow: 0 0 20px rgba(79, 209, 255, 0.3);
  }
</style>
</head>
<body>

<div class="core"></div>

<header>J A R V I S</header>

<div id="log"></div>

<footer>
  <input id="input" type="text" placeholder="Скажите что-нибудь, сэр..." autocomplete="off" autofocus>
  <button id="send">ОТПРАВИТЬ</button>
</footer>

<script>
  // ===== Подключаем Node.js модули (работает только в Electron) =====
  const fs    = require('fs');
  const path  = require('path');
  const { shell } = require('electron');

  const logEl   = document.getElementById('log');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // ===== Состояние ассистента =====
  const state = {
    awaitingBrowserChoice: false, // ждём ли выбор браузера
    pendingUrl: null              // URL, который надо открыть после выбора
  };

  // ===== Файл настроек рядом с приложением =====
  const CONFIG_PATH = path.join(process.cwd(), 'jarvis-config.json');

  function loadConfig() {
    try {
      if (fs.existsSync(CONFIG_PATH)) {
        return JSON.parse(fs.readFileSync(CONFIG_PATH, 'utf-8'));
      }
    } catch (e) {}
    return { preferredBrowser: null };
  }

  function saveConfig(cfg) {
    try {
      fs.writeFileSync(CONFIG_PATH, JSON.stringify(cfg, null, 2), 'utf-8');
    } catch (e) {}
  }

  let config = loadConfig();

  // ===== Вывод в лог =====
  function say(who, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;

    const prefix = who === 'user' ? '> Вы: '
                 : who === 'jarvis' ? '> Jarvis: '
                 : '> ';

    div.innerHTML = `<span class="prefix">${prefix}</span>${text}`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ===== Поиск установленных браузеров =====
  // Проверяем стандартные пути установки на Windows
  function findBrowsers() {
    const programFiles    = process.env['ProgramFiles']       || 'C:\\Program Files';
    const programFilesX86 = process.env['ProgramFiles(x86)']  || 'C:\\Program Files (x86)';
    const localAppData    = process.env['LOCALAPPDATA']       || '';
    const appData         = process.env['APPDATA']            || '';

    const candidates = [
      {
        key: 'chrome',
        name: 'Google Chrome',
        paths: [
          path.join(programFiles,    'Google\\Chrome\\Application\\chrome.exe'),
          path.join(programFilesX86, 'Google\\Chrome\\Application\\chrome.exe'),
          path.join(localAppData,    'Google\\Chrome\\Application\\chrome.exe')
        ]
      },
      {
        key: 'opera',
        name: 'Opera',
        paths: [
          path.join(localAppData, 'Programs\\Opera\\launcher.exe'),
          path.join(localAppData, 'Programs\\Opera\\opera.exe'),
          path.join(programFiles, 'Opera\\launcher.exe'),
          path.join(programFilesX86, 'Opera\\launcher.exe')
        ]
      },
      {
        key: 'edge',
        name: 'Microsoft Edge',
        paths: [
          path.join(programFilesX86, 'Microsoft\\Edge\\Application\\msedge.exe'),
          path.join(programFiles,    'Microsoft\\Edge\\Application\\msedge.exe')
        ]
      },
      {
        key: 'firefox',
        name: 'Mozilla Firefox',
        paths: [
          path.join(programFiles,    'Mozilla Firefox\\firefox.exe'),
          path.join(programFilesX86, 'Mozilla Firefox\\firefox.exe')
        ]
      },
      {
        key: 'yandex',
        name: 'Yandex Browser',
        paths: [
          path.join(localAppData, 'Yandex\\YandexBrowser\\Application\\browser.exe'),
          path.join(programFiles, 'Yandex\\YandexBrowser\\Application\\browser.exe')
        ]
      },
      {
        key: 'brave',
        name: 'Brave',
        paths: [
          path.join(programFiles,    'BraveSoftware\\Brave-Browser\\Application\\brave.exe'),
          path.join(programFilesX86, 'BraveSoftware\\Brave-Browser\\Application\\brave.exe')
        ]
      }
    ];

    const found = [];
    for (const c of candidates) {
      for (const p of c.paths) {
        try {
          if (p && fs.existsSync(p)) {
            found.push({ key: c.key, name: c.name, exe: p });
            break;
          }
        } catch (e) {}
      }
    }
    return found;
  }

  // ===== Открытие URL в конкретном браузере =====
  async function openInBrowser(browser, url) {
    try {
      // shell.openExternal сам подхватит уже открытый браузер
      // и откроет новую вкладку, если он запущен
      await shell.openExternal(url);
      return true;
    } catch (e) {
      say('sys', 'Ошибка запуска браузера: ' + e.message);
      return false;
    }
  }

  // ===== Команда: открыть YouTube =====
  async function cmdOpenYouTube() {
    const browsers = findBrowsers();

    if (browsers.length === 0) {
      say('jarvis', 'Не нашёл ни одного браузера на этом ПК, сэр.');
      return;
    }

    // Если браузер уже выбран ранее — используем его
    if (config.preferredBrowser) {
      const b = browsers.find(x => x.key === config.preferredBrowser);
      if (b) {
        say('jarvis', `Открываю YouTube в ${b.name}, сэр.`);
        await openInBrowser(b, 'https://www.youtube.com');
        return;
      }
    }

    // Иначе — спрашиваем
    say('jarvis', 'Какой браузер использовать? Найдены:');
    browsers.forEach((b, i) => {
      say('sys', `  ${i + 1}. ${b.name}`);
    });
    say('sys', 'Напишите название (например: opera). Скажите "запомни" — чтобы не спрашивал впредь.');

    state.awaitingBrowserChoice = true;
    state.pendingUrl = 'https://www.youtube.com';
  }

  // ===== Обработка выбора браузера =====
  async function handleBrowserChoice(text) {
    const lower = text.toLowerCase().trim();
    const browsers = findBrowsers();

    // Пользователь хочет запомнить
    const remember = lower.includes('запомни');
    const cleaned = lower.replace('запомни', '').trim();

    // Ищем браузер по ключу или имени
    let chosen = browsers.find(b => cleaned.includes(b.key));
    if (!chosen) {
      chosen = browsers.find(b => cleaned.includes(b.name.toLowerCase()));
    }

    // Может, ввёл цифру
    if (!chosen && /^\d+$/.test(cleaned)) {
      const idx = parseInt(cleaned, 10) - 1;
      if (browsers[idx]) chosen = browsers[idx];
    }

    if (!chosen) {
      say('jarvis', 'Не понял, сэр. Напишите название браузера из списка.');
      return;
    }

    say('jarvis', `Понял, использую ${chosen.name}.`);

    if (remember) {
      config.preferredBrowser = chosen.key;
      saveConfig(config);
      say('sys', `Запомнил: ${chosen.name} — браузер по умолчанию.`);
    }

    const url = state.pendingUrl || 'https://www.youtube.com';
    state.awaitingBrowserChoice = false;
    state.pendingUrl = null;

    await openInBrowser(chosen, url);
  }

  // ===== Команды =====
  const commands = [
    {
      triggers: ['ютуб', 'youtube', 'ютьюб', 'youtu.be'],
      action: cmdOpenYouTube
    },
    {
      triggers: ['привет', 'здравствуй', 'хай', 'hello'],
      action: () => say('jarvis', 'Здравствуйте, сэр. Чем могу помочь?')
    },
    {
      triggers: ['помощь', 'help', 'что ты умеешь', 'команды'],
      action: () => {
        say('jarvis', 'Доступные команды:');
        say('sys', '• "открой ютуб" — открыть youtube.com в браузере');
        say('sys', '• "привет" — поздороваться');
        say('sys', '• "сбрось браузер" — забыть выбранный браузер');
        say('sys', '• "помощь" — этот список');
      }
    },
    {
      triggers: ['сбрось браузер', 'забудь браузер', 'reset browser'],
      action: () => {
        config.preferredBrowser = null;
        saveConfig(config);
        say('jarvis', 'Хорошо, сэр. В следующий раз снова спрошу.');
      }
    }
  ];

  // ===== Обработка ввода =====
  async function handleInput(raw) {
    const text = raw.trim();
    if (!text) return;

    say('user', text);

    // Если ждём выбор браузера — обрабатываем это
    if (state.awaitingBrowserChoice) {
      await handleBrowserChoice(text);
      return;
    }

    const lower = text.toLowerCase();

    for (const cmd of commands) {
      if (cmd.triggers.some(t => lower.includes(t))) {
        await cmd.action();
        return;
      }
    }

    say('jarvis', 'Простите, сэр, я не распознал команду. Скажите "помощь".');
  }

  sendBtn.addEventListener('click', async () => {
    await handleInput(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  inputEl.addEventListener('keydown', async e => {
    if (e.key === 'Enter') {
      await handleInput(inputEl.value);
      inputEl.value = '';
    }
  });

  // ===== Приветствие =====
  say('jarvis', 'Система инициализирована. Jarvis к вашим услугам, сэр.');
  say('sys', 'Попробуйте: "открой ютуб"');
</script>

</body>
</html>
